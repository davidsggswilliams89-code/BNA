<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b5ed7">
  <title>Drinks | BNA, Busau Business</title>
  <style>
    :root {
      --blue:#0b5ed7;
      --blue-dark:#084298;
      --cream:#f7f9fc;
      --text:#172033;
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:var(--cream);
      color:var(--text);
    }
    .ticker {
      height:48px;
      overflow:hidden;
      display:flex;
      align-items:center;
      white-space:nowrap;
      background:#fff;
      border-bottom:1px solid #e6eaf0;
    }
    .ticker-track {
      display:inline-block;
      padding-left:100%;
      animation:move 12s linear infinite;
      font-weight:800;
      color:var(--blue-dark);
      letter-spacing:.6px;
    }
    @keyframes move {
      from { transform:translateX(0); }
      to { transform:translateX(-100%); }
    }
    .nav {
      display:grid;
      grid-template-columns:repeat(6,minmax(0,1fr));
      gap:6px;
      padding:8px;
      background:linear-gradient(135deg,var(--blue),var(--blue-dark));
      position:sticky;
      top:0;
      z-index:10;
    }
    .nav a {
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:48px;
      padding:8px 4px;
      color:#fff;
      text-decoration:none;
      font-size:.82rem;
      font-weight:700;
      border-radius:9px;
      background:rgba(255,255,255,.12);
    }
    .nav a:hover { background:rgba(255,255,255,.24); }
    main {
      width:min(100% - 28px,900px);
      margin:28px auto 40px;
    }
    .card {
      background:#fff;
      border-radius:20px;
      padding:34px 20px;
      text-align:center;
      box-shadow:0 8px 25px rgba(20,40,80,.09);
    }
    .icon {
      width:82px;
      height:82px;
      margin:0 auto 18px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:#eaf2ff;
      font-size:2.6rem;
    }
    h1 { margin:0 0 10px; color:var(--blue-dark); }
    p { line-height:1.6; color:#5d6878; }
    .back {
      display:inline-block;
      margin-top:16px;
      padding:12px 20px;
      border-radius:10px;
      background:var(--blue);
      color:#fff;
      text-decoration:none;
      font-weight:700;
    }
    footer {
      text-align:center;
      padding:18px;
      color:#6b7482;
      font-size:.85rem;
    }
    @media(max-width:650px) {
      .nav { grid-template-columns:repeat(3,1fr); }
      .nav a { min-height:44px; }
    }
  </style>
</head>
<body>
  <div class="ticker">
    <div class="ticker-track">BNA, Busau Business &nbsp; • &nbsp; BNA, Busau Business &nbsp; • &nbsp; BNA, Busau Business</div>
  </div>

  <nav class="nav" aria-label="Main navigation">
    <a href="account.html">👤 Account</a>
    <a href="store.html">🏪 Store</a>
  </nav>

  <main>
    <section class="card">
      <div class="icon">🥤</div>
      <h1>Drinks</h1>
      <p>Drinks products and services will be displayed here.</p>
      <a class="back" href="index-2-updated.html">← Back to Home</a>
    </section>
  </main>

  <footer>&copy; <span id="year"></span> BNA, Busau Business. All rights reserved.</footer>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
