<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0759b8">
  <title>BNA, Busau Business</title>
  <style>
    :root { --blue:#0759b8; --blue-dark:#064a99; --blue-light:#1877d5; --cream:#fffaf0; --text:#202820; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--cream); color:var(--text); }
    .top-marquee { height:42px; display:flex; align-items:center; overflow:hidden; white-space:nowrap; background:#fff; color:var(--blue); border-bottom:1px solid #e5e9df; font-weight:800; letter-spacing:1px; }
    .marquee-track { display:inline-block; padding-left:100%; animation:marquee 12s linear infinite; }
    .marquee-track span { display:inline-block; padding-right:80px; }
    @keyframes marquee { from{transform:translateX(0)} to{transform:translateX(-100%)} }
    .nav-banner { position:sticky; top:0; z-index:1000; padding:10px 8px; background:radial-gradient(circle at 10% 20%,rgba(255,255,255,.14),transparent 25%),radial-gradient(circle at 90% 80%,rgba(255,255,255,.10),transparent 25%),linear-gradient(135deg,var(--blue-dark),var(--blue-light)); box-shadow:0 3px 12px rgba(0,0,0,.15); }
    .nav-buttons { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px; width:100%; max-width:1100px; margin:0 auto; align-items:stretch; }
    .nav-button { min-width:0; min-height:52px; display:flex; align-items:center; justify-content:center; gap:5px; padding:7px 5px; border:1px solid rgba(255,255,255,.28); border-radius:10px; background:rgba(255,255,255,.12); color:#fff; text-decoration:none; font-size:.78rem; font-weight:700; text-align:center; line-height:1.2; transition:transform .18s ease,background .18s ease; -webkit-tap-highlight-color:transparent; }
    .nav-button:hover,.nav-button:active { transform:translateY(-2px); background:rgba(255,255,255,.23); }
    main { width:min(100% - 32px,900px); margin:28px auto 40px; }
    .section-title { margin:0 0 18px; text-align:center; font-size:1.25rem; color:var(--blue-dark); }
    .category-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .category { min-height:155px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:20px 12px; border:1px solid #e5e9df; border-radius:18px; background:#fff; box-shadow:0 5px 16px rgba(7,89,184,.08); text-align:center; transition:transform .2s ease,box-shadow .2s ease; }
    .category:hover { transform:translateY(-3px); box-shadow:0 9px 22px rgba(7,89,184,.13); }
    .category-icon { width:64px; height:64px; display:grid; place-items:center; border-radius:50%; background:#eaf3ff; font-size:2rem; }
    .category h2 { margin:0; color:var(--blue-dark); font-size:1.08rem; }
    footer { padding:18px 16px; color:#647067; text-align:center; font-size:.85rem; }
    @media (max-width:650px) { .nav-buttons{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;} .nav-button{min-height:48px;font-size:.70rem;padding:6px 3px;} }
    @media (max-width:360px) { .nav-buttons{gap:4px;} .nav-button{font-size:.62rem;padding:6px 2px;border-radius:8px;} main{width:calc(100% - 22px);} .category-grid{gap:10px;} .category{min-height:135px;} }
  </style>
</head>
<body>
  <header class="top-marquee" aria-label="Business name">
    <div class="marquee-track">
      <span>B-N-A Gusau Business</span>
      <span>B-N-A Gusau Business</span>
    </div>
  </header>
  <nav class="nav-banner" aria-label="Main navigation">
    <div class="nav-buttons">
      <a class="nav-button" href="account.html">👤 Account</a>
      <a class="nav-button" href="store.html">🏪 Store</a>
      <a class="nav-button" href="sales.html">🧾 Sales</a>
      <a class="nav-button" href="add-transaction.html">➕ Add Transaction</a>
    </div>
  </nav>

  <main>
    <section class="category-grid" aria-label="Store categories">
      <article class="category" id="drinks"><div class="category-icon" aria-hidden="true">🥤</div><h2>Drinks</h2></article>
      <article class="category" id="cereal"><div class="category-icon" aria-hidden="true">🌾</div><h2>Cereal</h2></article>
      <article class="category" id="pos"><div class="category-icon" aria-hidden="true">💳</div><h2>POS</h2></article>
      <article class="category" id="wifi"><div class="category-icon" aria-hidden="true">📶</div><h2>Wi-Fi Hotspot</h2></article>
    </section>
  </main>

  <footer>&copy; <span id="year"></span> BNA, Busau Business. All rights reserved.</footer>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    // Register the offline cache. Service workers require HTTPS or localhost.
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((error) => {
          console.warn("Offline support could not be enabled:", error);
        });
      });
    }
  </script>
</body>
</html>
