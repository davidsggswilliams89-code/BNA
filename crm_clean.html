<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0759b8">
<title>CRM</title>
<style>
:root{--blue:#0759b8;--blue-dark:#064a99;--green:#087f45;--cream:#f7f9fc;--text:#172033;--muted:#667085;--line:#e4e7ec;--danger:#c62828}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.top-marquee{height:42px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;background:#fff;color:var(--blue);border-bottom:1px solid var(--line);font-weight:800;letter-spacing:.6px}
.marquee-track{padding-left:100%;animation:marquee 14s linear infinite}
@keyframes marquee{to{transform:translateX(-100%)}}
.nav{position:sticky;top:0;z-index:5;padding:9px;background:linear-gradient(135deg,var(--blue-dark),#1877d5);box-shadow:0 3px 12px #00000018}
.nav-inner{max-width:1050px;margin:auto;display:flex;gap:8px;flex-wrap:wrap}
.nav a{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 14px;border:1px solid #ffffff45;border-radius:10px;background:#ffffff17;color:#fff;text-decoration:none;font-weight:700;font-size:.9rem}
main{width:min(100% - 28px,950px);margin:24px auto 40px}
.page-head{text-align:center;margin-bottom:20px}
.page-head h1{font-size:clamp(1.55rem,4vw,2.2rem);margin:0 0 8px;color:var(--blue-dark)}
.page-head p{margin:0;color:var(--muted);line-height:1.55}
.status{display:flex;align-items:flex-start;gap:9px;padding:12px 14px;border-radius:12px;margin:16px 0;background:#eaf3ff;color:#23456f;font-size:.92rem;line-height:1.5}
.status.error{background:#fff0f0;color:#9b1c1c}.status.success{background:#e9f8ef;color:#17663a}
.bill{background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(14px,3.5vw,30px);box-shadow:0 8px 28px #1428500c}
.bill h2{font-size:1.25rem;margin:0 0 8px;color:#101828}
.subtext{margin:0 0 20px;color:var(--muted);line-height:1.5}
.add-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-bottom:18px}
select,input{font:inherit;min-height:44px;border:1px solid #cfd5df;border-radius:10px;padding:10px 12px;background:#fff;color:var(--text);width:100%;min-width:0}
select:focus,input:focus{outline:2px solid #b7d2ff;border-color:var(--blue)}
.btn{border:0;border-radius:11px;min-height:43px;padding:10px 15px;font:inherit;font-weight:700;cursor:pointer;transition:filter .15s,transform .15s}
.btn:active{transform:scale(.98)}.btn:hover{filter:brightness(.96)}
.primary{background:#171717;color:#fff}.blue{background:var(--blue);color:#fff}.light{background:#eef2f7;color:#263449}.danger{background:#fff0f0;color:var(--danger)}.outline{border:1px solid #d0d5dd;background:#fff;color:#344054}
.product-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin:0 0 18px}
.product-option{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:5px;min-height:64px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;cursor:pointer;color:var(--text)}
.product-option:active{transform:scale(.99)}
.product-option .option-name{font-weight:800;overflow-wrap:anywhere}
.product-option .option-price{font-size:.9rem;color:var(--green);font-weight:700}
.product-option:disabled{opacity:.45;cursor:not-allowed}
.no-products{padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}
.cart-list{display:flex;flex-direction:column}
.cart-item{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(150px,.9fr) minmax(115px,.7fr);gap:16px;align-items:center;padding:22px 0;border-bottom:1px solid #eaecf0}
.product-name{font-size:1.12rem;font-weight:800;overflow-wrap:anywhere}
.unit-price{color:var(--muted);margin-top:8px;font-size:.93rem}
.qty-label{display:block;font-size:.86rem;color:var(--muted);margin-bottom:8px}
.qty-control{display:flex;align-items:center;gap:9px}
.qty-btn{width:42px;height:42px;flex:0 0 42px;border:1px solid #d0d5dd;border-radius:50%;background:#fff;font-size:1.15rem;font-weight:700;color:#344054;cursor:pointer}
.qty-value{font-size:1.15rem;font-weight:800;min-width:20px;text-align:center}
.item-total{text-align:right}
.item-total strong{display:block;font-size:1.22rem;overflow-wrap:anywhere}
.item-total small{display:block;color:var(--muted);margin-top:7px}
.item-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.icon-btn{border:0;background:transparent;font-size:1.2rem;padding:6px;cursor:pointer;border-radius:8px}
.icon-btn:hover{background:#f2f4f7}.icon-btn.delete{color:var(--danger)}
.edit-price{margin-top:10px;display:none;text-align:left}.edit-price.show{display:block}.edit-price label{display:block;color:var(--muted);font-size:.8rem;margin-bottom:5px}
.add-more{width:100%;min-height:58px;border:2px solid #e4e7ec;border-radius:999px;background:#fff;color:#475467;font-size:1.02rem;margin:22px 0;cursor:pointer}
.add-more span{font-size:1.4rem;margin-right:10px;vertical-align:-2px}
.total-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:24px 0 20px;margin-top:4px}
.total-row strong:first-child{font-size:clamp(1.15rem,3.6vw,1.75rem);color:#101828}
.total-amount{font-size:clamp(1.7rem,5vw,2.5rem);font-weight:900;color:var(--green);text-align:right;overflow-wrap:anywhere}
.complete{width:100%;min-height:62px;border-radius:999px;font-size:1.05rem}
.empty{padding:28px 12px;text-align:center;color:var(--muted);line-height:1.6;border:1px dashed #d0d5dd;border-radius:14px}
.sale-history{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.sale-history h2{margin:0 0 12px;color:var(--blue-dark);font-size:1.15rem}
.history-row{padding:12px 0;border-bottom:1px solid #eaecf0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.9rem}
.history-row:last-child{border-bottom:0}
footer{text-align:center;padding:18px;color:#6b7482;font-size:.85rem}
dialog{width:min(92vw,440px);border:0;border-radius:18px;padding:22px;box-shadow:0 20px 70px #0004}
dialog::backdrop{background:#10182888}
dialog h3{margin:0 0 14px}.dialog-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
@media(max-width:650px){
 main{width:calc(100% - 20px);margin-top:17px}
 .cart-item{grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:18px 0}
 .product-info{grid-column:1/-1}
 .quantity-area{grid-column:1;grid-row:2}
 .item-total{grid-column:2;grid-row:2;align-self:start}
 .item-actions{margin-top:8px}
 .add-row{grid-template-columns:1fr}
 .add-row .btn{width:100%}
 .bill{border-radius:17px}
}
@media(max-width:360px){.qty-control{gap:5px}.qty-btn{width:36px;height:36px;flex-basis:36px}.cart-item{gap:8px}.total-row{align-items:flex-start;flex-direction:column}.total-amount{text-align:left}}
</style>
</head>
<body>
<header class="top-marquee"><div class="marquee-track">B-N-A Gusau Business &nbsp; • &nbsp; CUSTOMER BILL &nbsp; • &nbsp; B-N-A Gusau Business &nbsp; • &nbsp; CUSTOMER BILL</div></header>
<nav class="nav" aria-label="Main navigation"><div class="nav-inner">
<a href="index.html">⌂ Home</a><a href="store.html">🏪 Store Inventory</a><a href="sales.html">🧾 Sales</a>
</div></nav>
<main>
  
  <div id="notice" class="status" role="status" hidden></div>
  <section class="bill">
    
    
    <div class="add-row">
      <input id="productSearch" type="search" placeholder="Search product name, e.g. beans…" aria-label="Search products">
    </div>
    <div id="productOptions" class="product-options" aria-label="Store products"></div>
    <div id="cartList" class="cart-list"><div class="empty">Your bill is empty. Choose a product above to begin.</div></div>
    <div class="total-row"><strong>TOTAL TO PAY</strong><div class="total-amount" id="grandTotal">₦0.00</div></div>
    <button class="btn primary complete" id="completeSale" type="button">Complete Sale</button>
    
  </section>
  
</main>


<dialog id="editDialog">
  <form method="dialog" id="editForm">
    <h3>Edit bill item</h3>
    <p id="editProductLabel" class="subtext"></p>
    <label for="editPrice" style="display:block;font-weight:700;margin-bottom:7px">Selling price for this bill (₦)</label>
    <input id="editPrice" type="number" min="0" step="0.01" required>
    
    <div class="dialog-actions"><button class="btn light" value="cancel">Cancel</button><button class="btn blue" id="saveEdit" value="save">Save Price</button></div>
  </form>
</dialog>
<script>
(() => {
  'use strict';
  const STORAGE_KEY = 'bna_store_inventory_v1';
  const SALES_KEY = 'bna_crm_sales_v1';
  const $ = id => document.getElementById(id);
  let products = [];
  let cart = [];
  let editingCartId = null;
  let recentSales = loadJson(SALES_KEY, []);

  function loadJson(key, fallback) {
    try { const parsed = JSON.parse(localStorage.getItem(key) || 'null'); return parsed == null ? fallback : parsed; }
    catch (_) { return fallback; }
  }
  function money(n) {
    return new Intl.NumberFormat('en-NG', {style:'currency',currency:'NGN',maximumFractionDigits:2}).format(Number(n) || 0);
  }
  function stockInfo(p) {
    const totalUnits = Math.max(0, (Number(p.packQuantity)||0) * (Number(p.muduPerPack)||0) * (Number(p.unitsPerMudu)||0));
    const soldUnits = Math.max(0, Number(p.soldUnits)||0);
    return {available:Math.max(0,totalUnits-soldUnits), unitPrice:Math.max(0,Number(p.unitPrice)||0)};
  }
  function setNotice(message, type='info') {
    const el = $('notice'); el.className = 'status' + (type==='error'?' error':type==='success'?' success':''); el.textContent = message;
  }
  function readProducts() {
    products = loadJson(STORAGE_KEY, []);
    if (!Array.isArray(products)) products = [];
    products = products.filter(p => p && p.id != null && typeof p.name === 'string');
    renderProductOptions();
    renderCart();
    if (!products.length) {
      setNotice('No products were found in store.html records on this browser. Open store.html, add and save products, then return here. Both pages must be hosted on the same website origin.', 'error');
    } else {
      setNotice('Loaded ' + products.length + ' product type(s) from Store. Tap a product name to add it to the bill.', 'success');
    }
  }

  function renderProductOptions() {
    const root = $('productOptions');
    const query = $('productSearch').value.trim().toLocaleLowerCase();
    const matches = products.filter(p => p.name.toLocaleLowerCase().includes(query));
    root.innerHTML = '';
    if (!matches.length) {
      const empty = document.createElement('div');
      empty.className = 'no-products';
      empty.textContent = query ? 'No matching products found.' : 'No products available.';
      root.appendChild(empty);
      return;
    }
    matches.forEach(p => {
      const info = stockInfo(p);
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'product-option';
      button.disabled = info.available <= 0;
      const name = document.createElement('span');
      name.className = 'option-name';
      name.textContent = p.name;
      const price = document.createElement('span');
      price.className = 'option-price';
      price.textContent = money(info.unitPrice);
      button.append(name, price);
      button.addEventListener('click', () => addProductById(String(p.id)));
      root.appendChild(button);
    });
  }

  function addProductById(id) {
    const p = products.find(item => String(item.id) === String(id));
    if (!p) { setNotice('That product is no longer in the Store records. Reload products and try again.', 'error'); return; }
    const info = stockInfo(p);
    if (info.available < 1) { setNotice('This product is out of stock.', 'error'); return; }
    const existing = cart.find(item => String(item.productId) === String(id));
    if (existing) {
      if (existing.quantity + 1 > info.available) { setNotice(`Only ${info.available} unit(s) of ${p.name} are available.`, 'error'); return; }
      existing.quantity += 1;
    } else {
      cart.push({cartId:makeId(), productId:p.id, name:p.name, unitPrice:info.unitPrice, quantity:1});
    }
    renderCart();
    setNotice(p.name + ' added to the bill.', 'success');
  }
  function makeId() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2); }
  function cartTotal() { return cart.reduce((sum,item)=>sum + item.quantity * item.unitPrice,0); }
  function renderCart() {
    const root = $('cartList');
    $('grandTotal').textContent = money(cartTotal());
    if (!cart.length) {
      root.innerHTML = '';
      return;
    }
    root.innerHTML = '';
    cart.forEach(item => {
      const p = products.find(product => String(product.id) === String(item.productId));
      const info = p ? stockInfo(p) : {available:0};
      const row = document.createElement('article');
      row.className = 'cart-item';
      const infoCol = document.createElement('div'); infoCol.className = 'product-info';
      const name = document.createElement('div'); name.className = 'product-name'; name.textContent = item.name;
      const unit = document.createElement('div'); unit.className = 'unit-price'; unit.textContent = money(item.unitPrice) + ' per piece';
      const priceEditor = document.createElement('div'); priceEditor.className = 'edit-price'; priceEditor.id = 'price-' + item.cartId;
      priceEditor.innerHTML = '<label>Price per piece (₦)</label><input type="number" min="0" step="0.01" aria-label="Edit price for '+escapeAttr(item.name)+'">';
      const priceInput = priceEditor.querySelector('input'); priceInput.value = item.unitPrice;
      priceInput.addEventListener('change', () => {
        const n = Number(priceInput.value);
        if (Number.isFinite(n) && n >= 0) { item.unitPrice = n; renderCart(); }
      });
      infoCol.append(name, unit, priceEditor);
      const qtyCol = document.createElement('div'); qtyCol.className = 'quantity-area';
      const qtyLabel = document.createElement('span'); qtyLabel.className = 'qty-label'; qtyLabel.textContent = `Quantity · ${info.available.toLocaleString()} available`;
      const controls = document.createElement('div'); controls.className = 'qty-control';
      const minus = document.createElement('button'); minus.className='qty-btn'; minus.type='button'; minus.textContent='−'; minus.setAttribute('aria-label','Decrease quantity');
      const qty = document.createElement('span'); qty.className='qty-value'; qty.textContent=item.quantity;
      const plus = document.createElement('button'); plus.className='qty-btn'; plus.type='button'; plus.textContent='+';
      minus.addEventListener('click',()=>{ if(item.quantity>1)item.quantity--; else cart=cart.filter(x=>x.cartId!==item.cartId); renderCart(); });
      plus.addEventListener('click',()=>{ const current=cart.reduce((s,x)=>s+(String(x.productId)===String(item.productId)?x.quantity:0),0); if(current+1>info.available){setNotice(`Only ${info.available} unit(s) of ${item.name} are available.`, 'error');return;} item.quantity++;renderCart(); });
      controls.append(minus,qty,plus); qtyCol.append(qtyLabel,controls);
      const totalCol=document.createElement('div');totalCol.className='item-total';
      const line=document.createElement('strong');line.textContent=money(item.quantity*item.unitPrice);
      const lineLabel=document.createElement('small');lineLabel.textContent='Line total';
      const actions=document.createElement('div');actions.className='item-actions';
      const edit=document.createElement('button');edit.className='icon-btn';edit.type='button';edit.textContent='✎';edit.title='Edit price';edit.setAttribute('aria-label','Edit price');
      edit.addEventListener('click',()=>{ const el=$('price-'+item.cartId);el.classList.toggle('show'); });
      const del=document.createElement('button');del.className='icon-btn delete';del.type='button';del.textContent='▤';del.title='Remove product';del.setAttribute('aria-label','Remove product');
      del.addEventListener('click',()=>{cart=cart.filter(x=>x.cartId!==item.cartId);renderCart();});
      actions.append(edit,del);totalCol.append(line,lineLabel,actions);
      row.append(infoCol,qtyCol,totalCol);root.appendChild(row);
    });
  }
  function escapeAttr(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function completeSale() {
    if (!cart.length) { setNotice('Add at least one product before completing a sale.', 'error'); return; }
    // Re-read the current store list so we do not rely on a stale page copy.
    const latest = loadJson(STORAGE_KEY, []);
    if (!Array.isArray(latest)) { setNotice('Could not read the Store records. Sale was not completed.', 'error'); return; }
    for (const item of cart) {
      const p = latest.find(product => String(product.id) === String(item.productId));
      if (!p) { setNotice(`${item.name} is no longer in Store. Sale was not completed.`, 'error'); return; }
      const info = stockInfo(p);
      const requested = cart.filter(x=>String(x.productId)===String(item.productId)).reduce((s,x)=>s+x.quantity,0);
      if (requested > info.available) { setNotice(`Not enough ${item.name} in stock. Available: ${info.available}. Sale was not completed.`, 'error'); return; }
    }
    const sale = {id:makeId(), date:new Date().toISOString(), items:cart.map(x=>({...x})), total:cartTotal()};
    cart.forEach(item=>{
      const p=latest.find(product=>String(product.id)===String(item.productId));
      p.soldUnits=Math.max(0,Number(p.soldUnits)||0)+item.quantity;
      p.updatedAt=new Date().toISOString();
    });
    try {
      localStorage.setItem(STORAGE_KEY,JSON.stringify(latest));
      recentSales.unshift(sale); recentSales=recentSales.slice(0,20);
      localStorage.setItem(SALES_KEY,JSON.stringify(recentSales));
    } catch (_) { setNotice('Browser storage could not be updated. Sale was not completed; check available storage.', 'error'); return; }
    const receipt = sale.items.map(x=>`${x.name} × ${x.quantity} — ${money(x.quantity*x.unitPrice)}`).join('\n');
    alert('SALE COMPLETED\n\n'+receipt+'\n\nTOTAL: '+money(sale.total));
    cart=[];readProducts();renderHistory();setNotice('Sale completed. Store stock and recent sales were updated on this device.', 'success');
  }
  function renderHistory() {
    const root=$('salesHistory');
    if(!recentSales.length){root.textContent='No completed sales recorded yet.';return;}
    root.innerHTML='';
    recentSales.slice(0,8).forEach(sale=>{
      const row=document.createElement('div');row.className='history-row';
      const left=document.createElement('span');left.textContent=new Date(sale.date).toLocaleString()+' · '+sale.items.length+' item type(s)';
      const right=document.createElement('strong');right.textContent=money(sale.total);
      row.append(left,right);root.appendChild(row);
    });
  }
  $('productSearch').addEventListener('input', renderProductOptions);
  $('completeSale').addEventListener('click',completeSale);
  $('year').textContent=new Date().getFullYear();
  // A refresh lets the CRM pick up products added/edited in store.html.
  window.addEventListener('focus',readProducts);
  window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY)readProducts();});
  readProducts();renderHistory();
})();
</script>
</body>
</html>
